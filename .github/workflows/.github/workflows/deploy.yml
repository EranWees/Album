# Name of the workflow
name: Build and Deploy to GitHub Pages

# Controls when the action will run.
# This workflow runs on pushes to the "main" branch.
on:
  push:
    branches: [ "main" ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build-and-deploy"
  build-and-deploy:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks out your repository under $GITHUB_WORKSPACE, so your job can access it
    - name: Checkout 🛎️
      uses: actions/checkout@v4

    # Sets up Node.js so you can use npm
    - name: Setup Node.js ⚙️
      uses: actions/setup-node@v4
      with:
        node-version: '20' # You can change this to your preferred Node.js version
        cache: 'npm'

    # Installs all the dependencies from package-lock.json
    - name: Install dependencies 📦
      run: npm install

    # Builds the app for production
    - name: Build 🔧
      run: npm run build

    # Deploys the built site to the gh-pages branch
    - name: Deploy 🚀
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages # The branch the action should deploy to.
        folder: build # The folder the action should deploy.
